<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent read-only Window fetch getter issues in restricted iframe environments
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(v) {
              currentFetch = v;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Unable to define fetch setter fallback:', e);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
